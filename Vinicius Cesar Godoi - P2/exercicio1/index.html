<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    
    <title>Exercício 1 | Prova 2º Bim</title>
</head>
<body>
    <img src="img/0.png" id="banner">
    
    <script>
        function trocarImagem(){
            let count = 0;
            let index = setInterval(()=>{
                count++;
                if(count > 2){
                    count = 0;
                    document.getElementById("banner").src = "img/0.png";
                    return;
                }
                document.getElementById("banner").src = "img/" + count + ".png";
            }, 2000);
        }

        trocarImagem()
    </script>
</body>
</html>
